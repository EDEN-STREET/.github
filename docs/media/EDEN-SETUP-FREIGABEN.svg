<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" role="img" aria-labelledby="t d"><title id="t">EDEN Suite Installation und Freigaben</title><desc id="d">Vom Terminalstart über den Lesecheck und Prüfplan zur Vorschau, gesonderten Freigabe und Verifikation</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061c17"/><stop offset="1" stop-color="#101426"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".35"/></filter></defs><rect width="1300" height="640" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="52" font-size="30" fill="#e5fff7" font-weight="700">UNIVERSAL SETUP  /  FREIGABE-GATES</text><rect x="36" y="176" width="209" height="170" rx="20" fill="#12282b" stroke="#68efc0" stroke-opacity=".75" stroke-width="2" filter="url(#sh)"/><text x="56" y="211" font-size="22" fill="#ffffff" font-weight="700">01 Terminal</text><text x="56" y="240" font-size="16" fill="#b2d4cf" font-weight="500">Plattform ermitteln</text><text x="56" y="267" font-size="16" fill="#b2d4cf" font-weight="500">keine Änderung</text><path d="M245 261 L290 261" stroke="#6deac3" stroke-width="3" stroke-linecap="round" opacity=".85"/><circle cx="290" cy="261" r="4" fill="#6deac3"/><rect x="290" y="176" width="209" height="170" rx="20" fill="#12282b" stroke="#68efc0" stroke-opacity=".75" stroke-width="2" filter="url(#sh)"/><text x="310" y="211" font-size="22" fill="#ffffff" font-weight="700">02 Read-only</text><text x="310" y="240" font-size="16" fill="#b2d4cf" font-weight="500">Hardware prüfen</text><text x="310" y="267" font-size="16" fill="#b2d4cf" font-weight="500">Risiken anzeigen</text><path d="M499 261 L545 261" stroke="#6deac3" stroke-width="3" stroke-linecap="round" opacity=".85"/><circle cx="545" cy="261" r="4" fill="#6deac3"/><rect x="545" y="176" width="209" height="170" rx="20" fill="#12282b" stroke="#68efc0" stroke-opacity=".75" stroke-width="2" filter="url(#sh)"/><text x="565" y="211" font-size="22" fill="#ffffff" font-weight="700">03 Vorschau</text><text x="565" y="240" font-size="16" fill="#b2d4cf" font-weight="500">Plan &amp; Dry-Run</text><text x="565" y="267" font-size="16" fill="#b2d4cf" font-weight="500">Backup prüfen</text><path d="M754 261 L801 261" stroke="#6deac3" stroke-width="3" stroke-linecap="round" opacity=".85"/><circle cx="801" cy="261" r="4" fill="#6deac3"/><rect x="801" y="176" width="209" height="170" rx="20" fill="#12282b" stroke="#fbc778" stroke-opacity=".75" stroke-width="2" filter="url(#sh)"/><text x="821" y="211" font-size="22" fill="#ffffff" font-weight="700">04 Freigabe</text><text x="821" y="240" font-size="16" fill="#b2d4cf" font-weight="500">Nur bei Bedarf</text><text x="821" y="267" font-size="16" fill="#b2d4cf" font-weight="500">kritisch: Stopp-Gate</text><path d="M1010 261 L1056 261" stroke="#6deac3" stroke-width="3" stroke-linecap="round" opacity=".85"/><circle cx="1056" cy="261" r="4" fill="#6deac3"/><rect x="1056" y="176" width="209" height="170" rx="20" fill="#12282b" stroke="#68efc0" stroke-opacity=".75" stroke-width="2" filter="url(#sh)"/><text x="1076" y="211" font-size="22" fill="#ffffff" font-weight="700">05 Verifikation</text><text x="1076" y="240" font-size="16" fill="#b2d4cf" font-weight="500">Test &amp; Audit</text><text x="1076" y="267" font-size="16" fill="#b2d4cf" font-weight="500">Rollback-Plan</text><rect x="300" y="426" width="700" height="96" rx="20" fill="#12282b" stroke="#ff8a98" stroke-opacity=".75" stroke-width="2" filter="url(#sh)"/><text x="320" y="461" font-size="22" fill="#ffffff" font-weight="700">FAIL CLOSED / STOPP</text><text x="320" y="490" font-size="16" fill="#b2d4cf" font-weight="500">Nicht kompatibel, keine Sicherung, ungeklärter Datenträger → keine Aktion</text><path d="M915 346 L915 426" stroke="#ff8a98" stroke-width="3" stroke-linecap="round" opacity=".85"/><circle cx="915" cy="426" r="4" fill="#ff8a98"/><text x="34" y="621" font-size="14" fill="#aac4bd" font-weight="500">EDEN STREET  ·  Konzept- und Dokumentationsansicht  ·  03.11.2026</text></g></svg>